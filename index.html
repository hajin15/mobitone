<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>MobiTone</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app">

    <!-- 배경 그라데이션 블롭 -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <!-- 상단 바 -->
    <header class="top-bar">
      <div class="logo">MobiTone</div>

      <div class="playlist-pill">
        <span>♫ Playlist</span>
        <button class="plus-btn" aria-label="추가">+</button>
      </div>

      <div class="icon-group">
        <button
          class="icon-btn"
          aria-label="다크모드 전환"
          id="themeToggleBtn"
        >
          🌙
        </button>

        <button
          class="icon-btn"
          aria-label="알람"
          id="alarmBtn"
        >
          ⏰
        </button>

        <button
          class="icon-btn"
          aria-label="설정"
          id="settingsBtn"
        >
          ⚙
        </button>

        <button
          class="icon-btn"
          aria-label="메뉴"
          id="menuBtn"
        >
          ☰
        </button>
      </div>
    </header>

    <!-- 가운데: 시계 + 인사말 -->
    <main class="center">
      <div id="clock" class="clock">--:--</div>

      <div id="greeting" class="greeting">
        안녕하세요
      </div>

      <div id="subtitle" class="subtitle">
        시작이 반이다
      </div>
    </main>

    <!-- 음악 플레이어 카드 -->
    <div class="player-card">

      <div class="album-art"></div>

      <div class="track-info">
        <div class="track-title" id="trackTitle">
          노래 제목
        </div>

        <div class="track-artist" id="trackArtist">
          가수 이름
        </div>
      </div>

      <div class="player-right">

        <div class="progress-row">
          <span class="time-label" id="currentTimeLabel">0:00</span>

          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <span class="time-label" id="durationLabel">0:00</span>
        </div>

        <div class="controls">
          <button id="prevBtn" aria-label="이전 곡">
            ⏮
          </button>

          <button id="playBtn" aria-label="재생">
            ▶
          </button>

          <button id="nextBtn" aria-label="다음 곡">
            ⏭
          </button>
        </div>

      </div>
    </div>

    <!-- 하단 바 -->
    <div class="bottom-bar"></div>

  </div>


  <!-- ============================== -->
  <!-- YouTube 플레이어 -->
  <!-- ============================== -->

  <div id="youtube-player"></div>


  <!-- TypeScript 컴파일 결과 -->
  <script src="dist/renderer.js"></script>

</body>
</html>
